<script src="{{ base_path }}/assets/js/main.min.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    // External links open in new tab (same-domain links stay in same tab)
    document.querySelectorAll("a[href]").forEach(function(link) {
      var href = link.getAttribute("href");
      if (href && !href.startsWith("#") && !href.startsWith("mailto:") &&
          link.hostname && link.hostname !== window.location.hostname) {
        link.setAttribute("target", "_blank");
        link.setAttribute("rel", "noopener noreferrer");
      }
    });

    // Dark mode toggle (event delegation — survives greedy-nav DOM manipulation)
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';

    function updateIcon(dark) {
      var icon = document.querySelector('#dark-mode-toggle i');
      if (icon) icon.className = dark ? 'fas fa-sun' : 'fas fa-moon';
    }

    updateIcon(isDark);

    document.addEventListener('click', function(e) {
      if (e.target.closest('#dark-mode-toggle')) {
        isDark = !isDark;
        if (isDark) {
          document.documentElement.setAttribute('data-theme', 'dark');
          localStorage.setItem('darkMode', 'true');
        } else {
          document.documentElement.removeAttribute('data-theme');
          localStorage.setItem('darkMode', 'false');
        }
        updateIcon(isDark);
      }
    });
  });
</script>
